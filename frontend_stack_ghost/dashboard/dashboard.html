<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dashboard.css" />
    
    <script type="module" src="dashboard.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="background-glow"></div>
      <header class="topbar">
        <div class="brand">
          <!-- logo ghost icon goes here -->
          <img class="brand__logo" src="img/vector-14.svg" alt="Stack Ghost logo" />
          <span class="brand__name">Stack Ghost</span>
        </div>
        <div class="search">
          <span class="search__icon">
            <!-- search icon goes here -->
            <img src="img/vector-4.svg" alt="" />
          </span>
          <input
            type="search"
            placeholder="Search for questions, users, tags"
            aria-label="Search for questions, users, tags"
          />
        </div>
        <div class="topbar__actions">
          <div class="notifications">
            <button
              class="icon-button notifications__toggle"
              aria-label="Notifications"
              aria-expanded="false"
              aria-haspopup="true"
              data-notifications-toggle
            >
              <!-- bell icon goes here -->
              <img src="img/vector-13.svg" alt="" />
            </button>
            <div class="notifications__dropdown glass" data-notifications-panel>
              <div class="notifications__header">
                <span>Notifications</span>
              </div>
              <ul class="list notifications__list" data-notifications-dropdown>
                <!-- filled by data -->
              </ul>
            </div>
          </div>
          <div class="avatar avatar--sm">
            <!-- profile image goes here -->
            <img id="profile-image" src="img/rafiki.png" alt="Profile" />
          </div>
        </div>
      </header>

      <div class="layout layout--dashboard">
        <aside class="sidebar sidebar--left">
          <nav class="nav">
            <div class="nav__section">
              <a class="nav__link" href="index.html">
                <!-- sidebar icon #1 -->
                <img class="nav__icon" src="img/vector.svg" alt="Home" />
                <span class="nav__text">Home</span>
              </a>
            </div>
            <hr class="sidebar-divider" />
            <div class="nav__section nav__section--cluster">
              <a class="nav__link" href="#">
                <!-- sidebar icon #2 -->
                <img class="nav__icon" src="img/vector-3.svg" alt="Questions" />
                <span class="nav__text">Questions</span>
              </a>
              <a class="nav__link" href="#">
                <!-- sidebar icon #3 -->
                <img class="nav__icon" src="img/vector-7.svg" alt="Users" />
                <span class="nav__text">Users</span>
              </a>
              <a class="nav__link" href="#">
                <!-- sidebar icon #4 -->
                <img class="nav__icon" src="img/vector-8.svg" alt="Tags" />
                <span class="nav__text">Tags</span>
              </a>
            </div>
            <hr class="sidebar-divider" />
            <div class="nav__section">
              <a class="nav__link" href="#">
                <!-- sidebar icon #5 -->
                <img class="nav__icon" src="img/vector-11.svg" alt="Badges" />
                <span class="nav__text">Badges</span>
              </a>
            </div>
            <hr class="sidebar-divider" />
            <div class="nav__section">
              <a class="nav__link nav__link--active" href="dashboard.html">
                <!-- sidebar icon #6 -->
                <img class="nav__icon" src="img/vector-11.svg" alt="Dashboard" />
                <span class="nav__text">Dashboard</span>
              </a>
            </div>
          </nav>
          <div class="sidebar__ghost">
            <!-- sidebar ghost illustration goes here -->
            <img src="img/ghost.png" alt="" />
          </div>
        </aside>

        <main class="content content--dashboard">
          <div class="breadcrumb">Home &gt; Dashboard</div>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab tab--active" data-tab="queue">
              Question Queue
            </button>
            <button class="tab" data-tab="reports">
              Reports
            </button>
          </div>

          <!-- Tab Content: Question Queue -->
          <div class="tab-content tab-content--active" data-tab-content="queue">
            <header class="section-header">
              <h2>12 Questions</h2>
            </header>
            <div class="cards-list" data-questions-list>
              <!-- Question cards will be populated here -->
            </div>
            <div class="pagination" data-questions-pagination>
              <!-- Pagination will be populated here -->
            </div>
          </div>

          <!-- Tab Content: Reports -->
          <div class="tab-content" data-tab-content="reports">
            <header class="section-header">
              <h2>12 Reports</h2>
            </header>
            <div class="cards-list" data-reports-list>
              <!-- Report cards will be populated here -->
            </div>
            <div class="pagination" data-reports-pagination>
              <!-- Pagination will be populated here -->
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
