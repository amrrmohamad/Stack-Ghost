<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module" src="dashboard.js" defer></script>
    <script type="module" src="../js/dashboard-visibility.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="background-glow"></div>
      <header class="topbar">
        <div class="brand">
          <!-- logo ghost icon goes here -->
          <img class="brand__logo" src="../signin,login/ghost.png" alt="Stack Ghost logo" onerror="this.style.display='none'" style="width: 40px; height: 40px;" />
          <span class="brand__name">Stack Ghost</span>
        </div>
        <div class="search">
          <span class="search__icon">
            <!-- search icon goes here -->
            <i data-lucide="search" style="width: 20px; height: 20px;"></i>
          </span>
          <input
            type="search"
            placeholder="Search for questions, users, tags"
            aria-label="Search for questions, users, tags"
          />
        </div>
        <div class="topbar__actions">
          <div class="notifications">
            <button
              class="icon-button notifications__toggle"
              aria-label="Notifications"
              aria-expanded="false"
              aria-haspopup="true"
              data-notifications-toggle
            >
              <!-- bell icon goes here -->
              <i data-lucide="bell" style="width: 20px; height: 20px; color: white;"></i>
            </button>
            <div class="notifications__dropdown glass" data-notifications-panel>
              <div class="notifications__header">
                <span>Notifications</span>
              </div>
              <ul class="list notifications__list" data-notifications-dropdown>
                <!-- filled by data -->
              </ul>
            </div>
          </div>
          <div class="avatar avatar--sm">
            <!-- profile icon -->
            <i data-lucide="circle-user" id="profile-icon" style="width: 36px; height: 36px; color: rgba(255, 255, 255, 0.9); stroke-width: 1.5;"></i>
          </div>
        </div>
      </header>

      <div class="layout layout--dashboard">
        <aside class="sidebar sidebar--left">
          <nav class="nav">
            <div class="nav__section">
              <a class="nav__link" href="../home/index.html">
                <i data-lucide="home" style="width: 20px; height: 20px;"></i>
                <span>Home</span>
              </a>
            </div>
            <hr class="sidebar-divider" />
            <div class="nav__section nav__section--cluster">
              <a class="nav__link" href="../questions/index.html">
                <i data-lucide="help-circle" style="width: 20px; height: 20px;"></i>
                <span>Questions</span>
              </a>
              <a class="nav__link" href="../users/index.html">
                <i data-lucide="users" style="width: 20px; height: 20px;"></i>
                <span>Users</span>
              </a>
              <a class="nav__link" href="../tages/index.html">
                <i data-lucide="tag" style="width: 20px; height: 20px;"></i>
                <span>Tags</span>
              </a>
              <a class="nav__link" href="../badges/index.html">
                <i data-lucide="award" style="width: 20px; height: 20px;"></i>
                <span>Badges</span>
              </a>
            </div>
            <hr class="sidebar-divider" />
            <div class="nav__section">
              <a class="nav__link" href="../profile/index.html">
                <i data-lucide="user" style="width: 20px; height: 20px;"></i>
                <span>My Profile</span>
              </a>
            </div>
            <hr class="sidebar-divider" />
            <div class="nav__section">
              <a class="nav__link nav__link--active" href="dashboard.html">
                <i data-lucide="settings" style="width: 20px; height: 20px;"></i>
                <span>Dashboard</span>
              </a>
            </div>
          </nav>
          <div class="sidebar__ghost">
            <!-- sidebar ghost illustration removed -->
          </div>
        </aside>

        <main class="content content--dashboard">
          <div class="breadcrumb">Home &gt; Dashboard</div>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab tab--active" data-tab="queue">
              Question Queue
            </button>
            <button class="tab" data-tab="reports">
              Reports
            </button>
          </div>

          <!-- Tab Content: Question Queue -->
          <div class="tab-content tab-content--active" data-tab-content="queue">
            <header class="section-header">
              <h2>12 Questions</h2>
            </header>
            <div class="cards-list" data-questions-list>
              <!-- Question cards will be populated here -->
            </div>
            <div class="pagination" data-questions-pagination>
              <!-- Pagination will be populated here -->
            </div>
          </div>

          <!-- Tab Content: Reports -->
          <div class="tab-content" data-tab-content="reports">
            <header class="section-header">
              <h2>12 Reports</h2>
            </header>
            <div class="cards-list" data-reports-list>
              <!-- Report cards will be populated here -->
            </div>
            <div class="pagination" data-reports-pagination>
              <!-- Pagination will be populated here -->
            </div>
          </div>
        </main>
      </div>

      <footer class="footer">
        <div class="footer-links">
          <a href="../home/index.html">Home</a>
          <a href="../questions/index.html">Questions</a>
          <a href="../users/index.html">Users</a>
          <a href="../tages/index.html">Tags</a>
          <a href="../badges/index.html">Badges</a>
          <a href="../profile/index.html">Profile</a>
        </div>
        <p class="footer-note">Stack Ghost · Crafted for clarity, speed, and collaboration.</p>
      </footer>
    </div>
    <script>
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    </script>
  </body>
</html>
