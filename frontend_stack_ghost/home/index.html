<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stack Ghost</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="styleguide.css" />
  <link rel="stylesheet" href="style.css" />

  <script type="module" src="app.js" defer></script>
</head>

<body>
  <div class="page">
    <div class="background-glow"></div>

    <header class="topbar">
      <div class="brand">
        <img class="brand__logo" src="img/vector-14.svg" alt="Stack Ghost logo" />
        <span class="brand__name">Stack Ghost</span>
      </div>
      <div class="search">
        <span class="search__icon"><img src="img/vector-4.svg" alt="" /></span>
        <input type="search" placeholder="Search..." />
      </div>
      <div class="topbar__actions">
        <div class="notifications">
          <button class="icon-button notifications__toggle" data-notifications-toggle>
            <img src="img/vector-13.svg" alt="" />
          </button>
          <div class="notifications__dropdown glass" data-notifications-panel>
            <div class="notifications__header"><span>Notifications</span></div>
            <ul class="list notifications__list" data-notifications-dropdown>
              <li style="padding:10px; color:#888;">Loading...</li>
            </ul>
          </div>
        </div>
        <div class="avatar avatar--sm">
          <img id="profile-image" src="img/rafiki.png" alt="Profile" />
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar sidebar--left">
        <nav class="nav">
          <div class="nav__section">
            <a class="nav__link nav__link--active" href="index.html">
              <img class="nav__icon" src="img/vector.svg" alt="" />
              <span>Home</span>
            </a>
          </div>

          <hr class="sidebar-divider" />

          <div class="nav__section nav__section--cluster">
            <a class="nav__link" href="../questions/index.html">
              <img class="nav__icon" src="img/vector-3.svg" alt="" />
              <span>Questions</span>
            </a>

            <a class="nav__link" href="../users/index.html">
              <img class="nav__icon" src="img/vector-7.svg" alt="" />
              <span>Users</span>
            </a>

            <a class="nav__link" href="../tags/index.html">
              <img class="nav__icon" src="img/vector-8.svg" alt="" />
              <span>Tags</span>
            </a>
          </div>

          <hr class="sidebar-divider" />

          <div class="nav__section">
            <a class="nav__link" href="../badges/index.html">
              <img class="nav__icon" src="img/vector-11.svg" alt="" />
              <span>Badges</span>
            </a>
          </div>
        </nav>

        <div class="sidebar__ghost">
          <img src="img/ghost.png" alt="" />
        </div>
      </aside>
      <main class="content">
        <div class="breadcrumb">Home &gt;</div>
        <section class="hero glass">
          <div class="hero__text">
            <p class="eyebrow">Daily plan</p>
            <h1>Hello <span class="accent" data-username>...</span>, what’s your plan?</h1>
            <div class="hero__actions">
              <button class="btn btn--primary">Explore Questions</button>
              <button class="btn btn--ghost" data-ask-question>Ask Question</button>
            </div>
          </div>
          <div class="hero__art">
            <img src="img/rafiki.png" alt="Ghost" />
          </div>
        </section>

        <section class="cards">
          <header class="section-header">
            <h2>Interesting posts for you</h2>
            <span class="section-pill">Curated for you</span>
          </header>

          <div class="card-list" data-questions-list>
            <div style="text-align:center; padding:40px; color:#666;">
              Loading questions...
            </div>
          </div>

          <div class="pagination" data-pagination
            style="margin-top:20px; display:flex; justify-content:center; gap:5px;"></div>
        </section>
      </main>

      <aside class="sidebar sidebar--right">
        <div class="card glass profile-card">
          <div class="profile-card__header">
            <div class="avatar avatar--lg">
              <img id="profile-image-side" src="img/rafiki.png" alt="User avatar" />
            </div>
            <div>
              <p class="profile-card__name" data-username>...</p>
              <p class="profile-card__role">Ghost explorer</p>
            </div>
          </div>
          <div class="stats">
            <div class="stat">
              <p class="stat__label">Reputation</p>
              <p class="stat__value" data-reputation>-</p>
            </div>
            <div class="stat">
              <p class="stat__label">Asked</p>
              <p class="stat__value" data-asked>-</p>
            </div>
            <div class="stat">
              <p class="stat__label">Answered</p>
              <p class="stat__value" data-answered>-</p>
            </div>
          </div>
        </div>

        <div class="card glass">
          <header class="section-header">
            <h3>Notifications</h3>
          </header>
          <ul class="list" data-notifications>
            <li class="list__item" style="color:#777;">Loading...</li>
          </ul>
        </div>

        <div class="card glass">
          <header class="section-header">
            <h3>Tags</h3>
          </header>
          <div class="tags" data-tags>
          </div>
        </div>
      </aside>
    </div>
  </div>
</body>

</html>
